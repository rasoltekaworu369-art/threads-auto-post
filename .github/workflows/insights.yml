name: Threads 計測

# JST 04:07(= UTC 19:07)。Routine C が JST 05:07 に読むので、その1時間前に数字を揃える。
on:
  schedule:
    - cron: '7 19 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '対象日(YYYY-MM-DD)。省略すると前日'
        required: false

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: insights を取得して reaction-log.csv に追記
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: bash scripts/fetch_insights.sh "${{ inputs.date }}"

      - name: 反応ログをコミット
        run: |
          git config user.name  "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add reaction-log.csv
          git diff --staged --quiet || git commit -m "計測: $(TZ=Asia/Tokyo date +%F)"
          git push
