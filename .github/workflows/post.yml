name: Threads 自動投稿

# 🔴 時刻の設計（2026-10-19 変更。ボス指示「毎回07分なのが気になる。00〜30分のランダムに」）
#
# 【実測】GitHub の定時実行は +25〜26分 遅れる（13:07予定→13:33 / 11:07予定→11:31）。
#        分を正確に指定することはできない。だから「遅れを織り込む」設計にした。
#
# 狙う枠（JST）: 06:00〜06:30 / 08 / 10 / 12 / 14 / 16 / 18 / 20 / 22（各 00〜30分）
# cron は UTC。枠の【前の時間】の :35 :45 :55 に3回発火させる。
#   → 遅れ 0〜30分 を足すと、だいたい枠の 00〜25分 に着地する
#   → 3回あるので、遅れが小さい日に取りこぼさない
#   → スクリプト側が「00〜30分の外では投稿しない」「同じ枠で二重投稿しない」を保証する
#
# 投稿される分は GitHub 側のばらつきで毎回変わる。これが狙いどおりのランダム性になる。
on:
  schedule:
    - cron: '35,45,55 20,22,0,2,4,6,8,10,12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '時刻の門を無視して投稿する（テスト用）'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 次の1本を投稿
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          FORCE_POST: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
        run: bash scripts/post_next.sh

      - name: 投稿記録をコミット
        run: |
          git config user.name  "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add posted/
          git diff --staged --quiet || git commit -m "記録: $(TZ=Asia/Tokyo date +'%F %H:%M') の投稿"
          git push
