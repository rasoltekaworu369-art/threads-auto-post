name: Threads 自動投稿

# JST 06:07 / 08:07 / 10:07 / 12:07 / 14:07 / 16:07 / 18:07 / 20:07 / 22:07 の9回。
# cron は UTC なので JST-9。毎時ピッタリを避けて :07 にしてある(高負荷時の遅延を軽減)。
on:
  schedule:
    - cron: '7 21,23,1,3,5,7,9,11,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 次の1本を投稿
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: bash scripts/post_next.sh

      - name: 投稿記録をコミット
        run: |
          git config user.name  "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add posted/
          git diff --staged --quiet || git commit -m "記録: $(TZ=Asia/Tokyo date +'%F %H:%M') の投稿"
          git push
