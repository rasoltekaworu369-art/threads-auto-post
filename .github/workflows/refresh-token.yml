name: Threads トークン更新

# 🔴 これを止めると60日で恒久的に失効し、OAuth からやり直しになる。
# 毎週日曜 JST 03:07(= UTC 土 18:07)。50日放置を待たず毎週更新する。
on:
  schedule:
    - cron: '7 18 * * 6'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 長期トークンを更新
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_SECRETS }}
        run: bash scripts/refresh_token.sh
