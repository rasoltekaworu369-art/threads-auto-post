name: Threads トークン点検・更新

# 🔴 これを止めると60日で失効する。
# GH_PAT_FOR_SECRETS が無い場合は「生存確認のみ」で、更新は行わない(保存できない更新は危険)。
# 毎週日曜 JST 03:07(= UTC 土 18:07)。50日放置を待たず毎週更新する。
on:
  schedule:
    - cron: '7 18 * * 6'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1        # 🔴 直列。並列だと main への push がぶつかる
      matrix:
        include:
          - acct: spi
            uid: THREADS_USER_ID
            tok: THREADS_ACCESS_TOKEN
            dormant: ''              # スピは Secret が消えたら大声で落ちる
          - acct: renai
            uid: THREADS_USER_ID_RENAI
            tok: THREADS_ACCESS_TOKEN_RENAI
            dormant: '1'             # 🔴 未有効化のあいだは何もせず終わる
    steps:
      - uses: actions/checkout@v4
      - name: 長期トークンを更新（${{ matrix.acct }}）
        env:
          ACCT: ${{ matrix.acct }}
          ALLOW_DORMANT: ${{ matrix.dormant }}
          THREADS_ACCESS_TOKEN: ${{ secrets[matrix.tok] }}
          TOKEN_SECRET_NAME: ${{ matrix.tok }}
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_SECRETS }}
        run: bash scripts/refresh_token.sh
